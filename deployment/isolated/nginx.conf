server {
    listen 80;
    server_name 192.3.236.57;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/caseledger-copy/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    server_name 192.3.236.57;

    ssl_certificate /etc/letsencrypt/live/caseledger-copy-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caseledger-copy-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/caseledger-copy/current/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 60m;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:5082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
