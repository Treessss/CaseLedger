[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.LegacyAPIWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "frontend",
    "deployment_backup",
    "backups",
    "outputs",
    "migrations/versions_archive",
]

[tool.ruff.lint]
# Started as a conservative baseline; see README "代码规范" for the ratchet plan.
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E402",  # module level import not at top (load_dotenv pattern is used on purpose)
    "E501",  # line length is handled by the formatter
    "F401",  # unused imports: cleaned up gradually, see per-file list below
    "F841",  # unused local variable: cleaned up gradually
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E", "W", "F"]
"migrate_*.py" = ["E", "W", "F"]
"app/models/*" = ["F"]
"app/api/*" = ["F"]
"app/services/*" = ["F"]
